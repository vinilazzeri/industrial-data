{% macro rotor(x, y, raio, classe='rotor') %}
<g transform="translate({{ x }} {{ y }})">
  <circle r="{{ raio + 3 }}" class="cavidade"/>
  <g class="peca-movel {{ classe }}">
    <circle r="{{ raio }}" class="metal-claro"/>
    <circle r="{{ raio - 3 }}" class="cavidade"/>
    {% for angulo in (0, 60, 120, 180, 240, 300) %}
    <path d="M2 -2 Q{{ raio - 2 }} -3 {{ raio - 3 }} -6 L{{ raio - 2 }} 1 Q6 4 2 2 Z"
          transform="rotate({{ angulo }})" class="pa"/>
    {% endfor %}
    <circle r="3.5" class="metal-claro"/>
    <circle r="1.2" class="luz-tecnica"/>
  </g>
</g>
{% endmacro %}
